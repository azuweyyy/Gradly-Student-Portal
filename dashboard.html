    <!-- Chart.js -->

}

.sidebar-logo{

    object-fit:contain;
    display:block;

    </style>

</head>

<body>

            <!-- PROFILE CARD -->

<div class="col-lg-4">

    <div
        class="table-card shadow-sm h-100 d-flex flex-column justify-content-center align-items-center text-center clickable-card"
        onclick="window.location.href='profile.html'"
    >

                object-fit: cover;
                border-radius: 50%;
            "
        >

        <!-- NAME -->

            Nur Azwa
        </h3>

        <!-- INFO -->

        <p class="text-muted mb-2">
            Semester 4
        </p>

        <p class="text-muted mb-0">
            CDIM2624ST1
        </p>

    </div>

</div>

        </div>

    </div>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- DASHBOARD SCRIPT -->

    <script>

        // =========================
        // SUBJECTS
        // =========================

        let subjects =
            JSON.parse(
                localStorage.getItem('subjects')
            ) || [];

        document.getElementById(
            'totalSubjects'
        ).innerText = subjects.length;

        // =========================
        // ATTENDANCE
        // =========================

        let attendance =
            JSON.parse(
                localStorage.getItem('attendance')
            );

        if(attendance){

            let totalAttendance =

                attendance.present +
                attendance.absent +
                attendance.mc;

            let percentage = 0;

            if(totalAttendance > 0){

                percentage = Math.round(

                    (attendance.present /
                    totalAttendance)

                    * 100

                );

            }

            document.getElementById(
                'attendancePercent'
            ).innerText = percentage + "%";

        }

        // =========================
        // GPA DATA
        // =========================

        let semesterGPA =
            JSON.parse(
                localStorage.getItem('semesterGPA')
            ) || [

                3.49,
                3.54,
                3.80

            ];

        // =========================
        // CGPA
        // =========================

        let total =
            semesterGPA.reduce(
                (a, b) => a + b,
                0
            );

        let cgpa =
            (total / semesterGPA.length)
            .toFixed(2);

        document.getElementById(
            'cgpaDisplay'
        ).innerText = cgpa;

        // =========================
        // GPA LINE CHART
        // =========================

        const ctx =
            document.getElementById(
                'performanceChart'
            );

        new Chart(ctx, {

            type: 'line',

            data: {

                labels: [

                    'Semester 1',
                    'Semester 2',
                    'Semester 3',
                    'Semester 4',
                    'Semester 5',
                    'Semester 6'

                ],

                datasets: [{

                    label: 'GPA',

                    data: semesterGPA,

                    tension: 0.4,

                    fill: false,

                    borderWidth: 3,

                    pointRadius: 5

                }]

            },

            options: {

                responsive: true,

                plugins: {

                    legend: {

                        display: true

                    }

                },

                scales: {

                    y: {

                        min: 0,
                        max: 4

                    }

                }

            }

        });

    </script>

    <!-- DARK MODE -->

    <!-- DARK MODE -->

<script>

    const darkModeToggle =
        document.getElementById('darkModeToggle');

    const darkModeIcon =
        document.getElementById('darkModeIcon');

    const body =
        document.body;

    // =========================
    // LOAD SAVED THEME
    // =========================

    const savedTheme =
        localStorage.getItem('theme') || 'light';

    body.setAttribute(
        'data-bs-theme',
        savedTheme
    );

    updateIcon(savedTheme);

    // =========================
    // TOGGLE DARK MODE
    // =========================

    darkModeToggle.addEventListener('click', () => {

        const currentTheme =
            body.getAttribute('data-bs-theme');

        const newTheme =
            currentTheme === 'dark'
            ? 'light'
            : 'dark';

        body.setAttribute(
            'data-bs-theme',
            newTheme
        );

        localStorage.setItem(
            'theme',
            newTheme
        );

        updateIcon(newTheme);

    });

    // =========================
    // UPDATE ICON
    // =========================

    function updateIcon(theme){

        if(theme === 'dark'){

            darkModeIcon.className =
                'bi bi-sun-fill';

        } else {

            darkModeIcon.className =
                'bi bi-moon-stars-fill';

        }

    }

</script>
